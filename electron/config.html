<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K.F.C. 서버 연결</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#f0faf7,#f5f7fb 70%);font:15px 'Segoe UI','Malgun Gothic',sans-serif;color:#1b2c43}.card{width:min(92vw,490px);padding:36px;background:white;border:1px solid #e6edf1;border-radius:22px;box-shadow:0 20px 70px #15334a12}.brand{width:72px;height:72px;display:grid;place-items:center;border-radius:21px;background:linear-gradient(145deg,#fff,#e8eef6);box-shadow:0 7px 0 #d4dfec,0 13px 24px #182d4a20}.brand img{width:65px;height:65px;object-fit:contain;border-radius:16px}.tag{margin:26px 0 8px;color:#8190a0;letter-spacing:.15em;font-size:11px;font-weight:800}h1{font-size:29px;letter-spacing:-1px;margin:0 0 10px}p{color:#788596;line-height:1.7;font-size:14px}label{display:block;margin:22px 0 7px;font-weight:700;font-size:13px}input{width:100%;padding:14px;border:1px solid #dfe7ed;border-radius:11px;font-size:14px;outline:none}input:focus{border-color:#43c9ae;box-shadow:0 0 0 3px #43c9ae20}button{width:100%;margin-top:14px;border:0;border-radius:11px;padding:14px;background:#43c9ae;color:#12333b;font-size:14px;font-weight:800;cursor:pointer}.hint{font-size:12px;color:#9aa5b2;margin-top:10px}.error{color:#ad4945;background:#fff0ef;padding:10px 12px;border-radius:9px;font-size:13px;line-height:1.5;display:none}
</style></head>
<body><main class="card"><div class="brand"><img src="../public/kfc-logo.png" alt="K.F.C. 동아리 로고"></div><div class="tag">K.F.C. ROBOTICS CLUB</div><h1>서버에 연결해 주세요</h1><p>배포된 홈페이지 주소를 입력하면 웹과 같은 계정으로 이용할 수 있습니다. 로컬 개발 중에는 localhost 주소를 사용할 수 있습니다.</p>
<form id="form"><label for="url">홈페이지 주소</label><input id="url" type="url" placeholder="https://kfc.example.kr" required><div class="hint">주소는 https://로 시작해야 합니다. 개발 환경은 http://localhost:4173</div><div id="error" class="error"></div><button>연결하고 시작하기 →</button></form></main>
<script>
(async()=>{const saved=await window.kfcDesktop.getServerUrl();if(saved)document.getElementById('url').value=saved;})();
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const result=await window.kfcDesktop.setServerUrl(document.getElementById('url').value);if(!result.ok){const box=document.getElementById('error');box.textContent=result.message;box.style.display='block';}});
</script></body></html>
